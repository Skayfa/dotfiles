# lazygit — palette Everforest Dark, comme Alacritty, tmux, nvim, hunk et fzf.
# lazygit ne peint pas son fond : il hérite de celui du terminal (#2d353b). Les couleurs
# ci-dessous sont celles d'Everforest pensées pour ce fond. defaultFgColor reste `default`
# = le texte du terminal, jamais une couleur en dur (cf. le bug "noir sur noir", 8bb4e93).
gui:
  border: rounded
  showFileTree: true
  showPanelJumps: true
  nerdFontsVersion: "3"        # icônes Nerd Font
  theme:
    activeBorderColor:
      - "#a7c080"             # panneau ACTIF : vert Everforest
      - bold
    inactiveBorderColor:
      - "#859289"             # panneaux inactifs : gris discret
    searchingActiveBorderColor:
      - "#dbbc7f"             # recherche en cours : jaune
      - bold
    optionsTextColor:
      - "#7fbbb3"             # barre d'aide en bas : bleu
    selectedLineBgColor:
      - "#3d484d"             # ligne sélectionnée : gris-vert, texte lisible dessus
    selectedRangeBgColor:
      - "#3d484d"
    cherryPickedCommitFgColor:
      - "#7fbbb3"
    cherryPickedCommitBgColor:
      - "#475258"
    markedBaseCommitFgColor:
      - "#dbbc7f"
    unstagedChangesColor:
      - "#e67e80"             # changements non-stagés : rouge Everforest
    defaultFgColor:
      - default

# Cycle des onglets d'un panneau (Files <-> Worktrees <-> Submodules, etc.)
# Defaults '[' / ']' inutilisables en AZERTY Mac (option_as_alt). Ctrl+h = Backspace
# dans Alacritty, donc prevTab -> Ctrl+a ("arrière"), nextTab -> Ctrl+l.
keybinding:
  universal:
    prevTab: "<c-a>"
    nextTab: "<c-l>"
