# Souris : cliquer pour changer de pane, scroller, redimensionner
set -g mouse on

# Historique de scroll plus profond
set -g history-limit 50000

# Numérotation à partir de 1 (au lieu de 0)
set -g base-index 1
setw -g pane-base-index 1

# Splits plus intuitifs : | vertical, - horizontal
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Recharger la config sans quitter tmux : préfixe + r
bind r source-file ~/.tmux.conf \; display "Config rechargée"

# Navigation entre panes avec préfixe + flèches
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# Couleurs correctes (important pour Alacritty + p10k)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"

# lazygit du projet courant en popup overlay (rapide, se ferme à la sortie) : préfixe + g
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# lazygit du projet courant dans une fenêtre tmux persistante : préfixe + G
bind G new-window -c "#{pane_current_path}" -n lazygit lazygit
# lazysql (bases de données) en popup overlay : préfixe + D
bind D display-popup -E -w 90% -h 90% lazysql
# hunk (review du diff courant) en popup overlay : préfixe + h
# Pour suivre un agent qui édite : split (préfixe v) puis `hd --watch`.
bind h display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "hunk diff"
# hunk sur un commit choisi dans l'historique : préfixe + b (browse)
# `hunk diff` ci-dessus ne voit que le working tree -> vide une fois commité.
bind b display-popup -E -w 90% -h 90% -d "#{pane_current_path}" hunk-log
# nvim du projet courant dans une fenêtre tmux dédiée : préfixe + e
# Fenêtre et non popup : l'éditeur est persistant (on y revient), un popup se
# ferme à la moindre sortie et coupe la nav ⌥flèches vers les autres panes.
# Si une fenêtre "nvim" existe déjà dans la session, on y saute au lieu d'en
# ouvrir une seconde — sinon chaque appui lancerait une instance de plus.
# La cible est préfixée par la session : un `-t nvim` nu retrouve une fenêtre
# "nvim" de N'IMPORTE quelle session et t'y téléporte.
bind e if-shell 'tmux select-window -t "#{session_name}:nvim"' '' 'new-window -c "#{pane_current_path}" -n nvim nvim'
# Sélecteur de sessions en popup fzf : préfixe + S
# (le natif `préfixe s` est pris par le split horizontal ; `préfixe w` reste
#  l'arbre sessions+fenêtres, et `préfixe (` / `)` cyclent d'une session à l'autre)
# Le nom vient de `cut`, pas d'un `-F "#{session_name}"` : display-popup expanse
# les formats AVANT de lancer le shell, ce qui figerait la session courante.
# fzf sort en 1 si tu annules -> le && n'exécute alors aucun switch.
bind S display-popup -E -w 40% -h 40% 'S=$(tmux list-sessions | cut -d: -f1 | fzf --reverse --prompt="session> ") && tmux switch-client -t "$S"'

# ===================== DESIGN — Powerline Everforest (same palette as Alacritty) =====================
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e2326,fg=#d3c6aa"

# gauche : nom de session
set -g status-left-length 40
set -g status-left "#[fg=#2d353b,bg=#a7c080,bold]   #S #[fg=#a7c080,bg=#1e2326]#[default]"

# liste des fenêtres
set -g window-status-separator ""
set -g window-status-format "#[fg=#859289,bg=#1e2326]  #I #W "
set -g window-status-current-format "#[fg=#a7c080,bg=#1e2326]#[fg=#2d353b,bg=#a7c080,bold] #I #W #[fg=#a7c080,bg=#1e2326]#[default]"

# droite : date + heure
set -g status-right-length 60
set -g status-right "#[fg=#343f44,bg=#1e2326]#[fg=#d3c6aa,bg=#343f44]  %d/%m #[fg=#a7c080,bg=#343f44]#[fg=#2d353b,bg=#a7c080,bold]  %H:%M #[default]"

# bordures de panes
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#a7c080"

# Inactive panes a shade darker: the focused one stands out
set -g window-style "bg=#232a2e"
set -g window-active-style "bg=#2d353b"

# Window name = folder name (the process name of Claude Code is its version)
set -g automatic-rename-format "#{b:pane_current_path}"

# messages + mode copie
set -g message-style "bg=#a7c080,fg=#2d353b,bold"
set -g mode-style "bg=#a7c080,fg=#2d353b"

# activité des fenêtres
setw -g monitor-activity on
set -g visual-activity off

# ===================== NAVIGATION FLUIDE =====================
# Panes : ⌥ + flèches (SANS préfixe) — ⌥hjkl rendu à nvim (terminaux NvChad)
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Fenêtres : Shift + flèches (SANS préfixe)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Redimensionner les panes : préfixe + H/J/K/L (répétable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Aide-mémoire perso : préfixe + ?
# Chemin en '~' : ce fichier est LIÉ au repo, donc jamais passé au sed d'install.sh.
# tmux exécute la commande via /bin/sh, qui étend le ~. Ne pas y remettre de placeholder.
bind ? display-popup -E -w 80% -h 80% "less -R ~/.config/tmux/cheatsheet.txt"

# ===================== ÉCHANGER DES PANES =====================
# préfixe + Ctrl + h/j/k/l : échanger le pane courant avec son voisin (direction)
bind -r C-h swap-pane -t '{left-of}'
bind -r C-j swap-pane -t '{down-of}'
bind -r C-k swap-pane -t '{up-of}'
bind -r C-l swap-pane -t '{right-of}'
# bonus : faire tourner tous les panes
bind -r C-o rotate-window

# ===================== QoL (revue dotfiles) =====================
set -sg escape-time 10          # plus de lag sur Échap dans nvim
set -g focus-events on          # autoread nvim / events focus
set -g renumber-windows on      # renumérote les fenêtres après fermeture
setw -g mode-keys vi            # navigation vi en mode copie
# copie -> presse-papier macOS
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# ===================== PLUGINS (TPM) =====================
# Survivre à un reboot : resurrect sauvegarde/restaure sessions, fenêtres, panes
# et cwd ; continuum s'appuie dessus pour le faire automatiquement.
# Sauvegarde manuelle : préfixe + Ctrl-s — restauration manuelle : préfixe + Ctrl-r
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'   # conserve le scrollback des panes
set -g @resurrect-strategy-nvim 'session'      # restaure les sessions nvim
set -g @continuum-save-interval '15'           # minutes entre deux sauvegardes auto
set -g @continuum-restore 'on'                 # restaure au démarrage du serveur tmux

# TPM doit rester la DERNIÈRE ligne du fichier
run '~/.tmux/plugins/tpm/tpm'
