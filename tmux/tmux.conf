# Souris : cliquer pour changer de pane, scroller, redimensionner
set -g mouse on

# Historique de scroll plus profond
set -g history-limit 50000

# Numérotation à partir de 1 (au lieu de 0)
set -g base-index 1
setw -g pane-base-index 1

# Splits plus intuitifs : | vertical, - horizontal
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Recharger la config sans quitter tmux : préfixe + r
bind r source-file ~/.tmux.conf \; display "Config rechargée"

# Navigation entre panes avec préfixe + flèches
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# fzf in the popups (sessions, board, history): same options and Everforest colours as the shell
set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.config/fzf/fzfrc"
set-environment -gu FZF_DEFAULT_OPTS

# Couleurs correctes : 256 couleurs + true color pour Alacritty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"
# OSC 8 hyperlinks (tmux >= 3.4): without it tmux drops the links of Claude Code's panes, Cmd+click opens nothing
set -as terminal-features ",alacritty:hyperlinks"

# lazygit du projet courant en popup overlay (rapide, se ferme à la sortie) : préfixe + g
bind g display-popup -E -T " lazygit " -w 90% -h 90% -d "#{pane_current_path}" lazygit
# lazygit du projet courant dans une fenêtre tmux persistante : préfixe + G
bind G new-window -c "#{pane_current_path}" -n lazygit lazygit
# lazysql (bases de données) en popup overlay : préfixe + D
bind D display-popup -E -T " lazysql " -w 90% -h 90% lazysql
# hunk (review du diff courant) en popup overlay : préfixe + h
# Pour suivre un agent qui édite : split (préfixe v) puis `hd --watch`.
bind h display-popup -E -T " hunk · diff " -w 90% -h 90% -d "#{pane_current_path}" "hunk diff"
# hunk sur un commit choisi dans l'historique : préfixe + b (browse)
# `hunk diff` ci-dessus ne voit que le working tree -> vide une fois commité.
bind b display-popup -E -T " hunk · historique " -w 90% -h 90% -d "#{pane_current_path}" hunk-log
# The IDE: the current pane's project in Zed (reading and navigating Claude's code, mouse, no modes): prefix e
# A Zed window already open on that folder is brought forward, not duplicated. nvim stays for quick edits (`vim file`).
bind e run -b 'zed "#{pane_current_path}"'
# Open a file: prefix f. Lists the paths cited in the pane (Claude's, even wrapped over two lines), then the folder's files.
# Enter = default app, ^F = Finder, ^E = Zed, ^Y = copy the path. Replaces tmux's find-window (prefix Tab does that).
bind f display-popup -E -T " ouvrir un fichier " -w 90% -h 80% -d "#{pane_current_path}" '~/.local/bin/open-file "#{pane_id}"'
# Switch session: prefix S (fzf popup). Name comes from `cut`, not -F "#{session_name}": display-popup expands
# formats before the shell runs, which would freeze the current session. fzf exits 1 on cancel -> no switch.
bind S display-popup -E -T " sessions " -w 40% -h 40% 'S=$(tmux list-sessions | cut -d: -f1 | fzf --reverse --prompt="session> ") && tmux switch-client -t "$S"'
# Windows AND sessions: tmux 3.8 native fuzzy picker on prefix Tab
# Jump to the next Claude waiting for you, in any session: prefix a
bind a run -b '~/.local/bin/claude-tmux-wait next'
# History of Claude notifications (finished, permission, question), Enter jumps there: prefix N
bind N display-popup -E -T " notifications Claude " -w 80% -h 60% '~/.local/bin/claude-tmux-wait history'
# Board of every Claude (blocked, your turn, working), with context and effort, live: prefix A
bind A display-popup -E -T " Claude " -w 90% -h 60% '~/.local/bin/claude-tmux-wait board'

# ===================== DESIGN — Powerline Everforest (same palette as Alacritty) =====================
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e2326,fg=#d3c6aa"

# gauche : nom de session
set -g status-left-length 40
# Session block turns orange while the prefix is armed (⌘b pressed, waiting for a key)
set -g status-left "#[bg=#1e2326]#{?client_prefix,#[fg=#e69875],#[fg=#a7c080]}#[fg=#2d353b]#[bold]#{?client_prefix,#[bg=#e69875],#[bg=#a7c080]}  #S #[bg=#1e2326]#[nobold]#{?client_prefix,#[fg=#e69875],#[fg=#a7c080]}#[default] "

# liste des fenêtres
set -g window-status-separator ""
# tmux 3.8 underlines the current tab and reverses alerted ones by default: the formats below do all the styling
set -g window-status-current-style default
set -g window-status-bell-style default
set -g window-status-activity-style default
# Tab markers:  = pane zoomed (prefix z), ● = Claude waiting for you (bin/claude-tmux-wait)
set -g window-status-format "#[fg=#859289,bg=#1e2326] #I #W#{?window_zoomed_flag, ,}#[fg=#e69875]#[bold]#{?@claude_wait, ●,}#[nobold] "
set -g window-status-current-format "#[fg=#a7c080,bg=#1e2326]#[fg=#2d353b,bg=#a7c080,bold]#I #W#{?window_zoomed_flag, ,}#{?@claude_wait, ● ,}#[fg=#a7c080,bg=#1e2326,nobold]#[default]"

# Right: Claudes waiting in OTHER sessions (current one is in the tabs), git branch of the pane, time
# (no date: the macOS menu bar already shows it)
set -g status-right-length 120
set -g status-right '#[fg=#e69875]#[bold]#{S:#{?#{!=:#{session_name},#{client_session}},#{?#{W:#{?@claude_wait,1,}}, #{session_name} ● ,},}}#[default]#[fg=#83c092]#(b=$(git -C "#{pane_current_path}" branch --show-current 2>/dev/null) && [ -n "$b" ] && echo "  $b ")#[fg=#343f44,bg=#1e2326]#[fg=#d3c6aa,bg=#343f44]  %H:%M #[fg=#343f44,bg=#1e2326]#[default]'

# Popups (lazygit, hunk, notifications...): rounded green border, title in the border
set -g popup-border-lines rounded
set -g popup-border-style "fg=#a7c080"

# bordures de panes
# Title on top of each pane (index, folder, command), only when the window is split
set -g pane-border-format " #{pane_index} #{b:pane_current_path} · #{pane_current_command} "
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
run -b 'for w in $(tmux list-windows -a -F "#{window_id}"); do tmux set -wF -t "$w" pane-border-status "#{?#{>:#{window_panes},1},top,off}"; done'
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#a7c080"

# Inactive panes a shade darker: the focused one stands out
set -g window-style "bg=#232a2e"
set -g window-active-style "bg=#2d353b"

# Window name = folder name (the process name of Claude Code is its version)
set -g automatic-rename-format "#{b:pane_current_path}"

# messages + mode copie
set -g message-style "bg=#a7c080,fg=#2d353b,bold"
set -g mode-style "bg=#a7c080,fg=#2d353b"

# Activity alerts off: every Claude window lit up constantly. The ● marker replaces them.
setw -g monitor-activity off
set -g visual-activity off

# ===================== NAVIGATION FLUIDE =====================
# Panes : ⌥ + flèches (SANS préfixe)
# Only when a pane exists that way: otherwise the key goes to the program, so ⌥←/→ jumps a word in
# zsh, Claude Code and nvim (always the case in a window with a single pane).
bind -n M-Left  if -F '#{pane_at_left}'   'send-keys M-Left'  'select-pane -L'
bind -n M-Down  if -F '#{pane_at_bottom}' 'send-keys M-Down'  'select-pane -D'
bind -n M-Up    if -F '#{pane_at_top}'    'send-keys M-Up'    'select-pane -U'
bind -n M-Right if -F '#{pane_at_right}'  'send-keys M-Right' 'select-pane -R'

# Fenêtres : Shift + flèches (SANS préfixe)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Redimensionner les panes : préfixe + H/J/K/L (répétable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Aide-mémoire perso : préfixe + ?
# Chemin en '~' : ce fichier est LIÉ au repo, donc jamais passé au sed d'install.sh.
# tmux exécute la commande via /bin/sh, qui étend le ~. Ne pas y remettre de placeholder.
bind ? display-popup -E -T " aide-mémoire " -w 80% -h 80% "less -R ~/.config/tmux/cheatsheet.txt"

# ===================== ÉCHANGER DES PANES =====================
# préfixe + Ctrl + h/j/k/l : échanger le pane courant avec son voisin (direction)
bind -r C-h swap-pane -t '{left-of}'
bind -r C-j swap-pane -t '{down-of}'
bind -r C-k swap-pane -t '{up-of}'
bind -r C-l swap-pane -t '{right-of}'
# bonus : faire tourner tous les panes
bind -r C-o rotate-window

# ===================== QoL (revue dotfiles) =====================
set -sg escape-time 10          # plus de lag sur Échap dans nvim
set -g focus-events on          # autoread nvim / events focus
set -g renumber-windows on      # renumérote les fenêtres après fermeture
setw -g mode-keys vi            # navigation vi en mode copie
# copie -> presse-papier macOS
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# ===================== PLUGINS (TPM) =====================
# Survivre à un reboot : resurrect sauvegarde/restaure sessions, fenêtres, panes
# et cwd ; continuum s'appuie dessus pour le faire automatiquement.
# Sauvegarde manuelle : préfixe + Ctrl-s — restauration manuelle : préfixe + Ctrl-r
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'   # conserve le scrollback des panes
set -g @resurrect-strategy-nvim 'session'      # restaure les sessions nvim
set -g @continuum-save-interval '15'           # minutes entre deux sauvegardes auto
set -g @continuum-restore 'on'                 # restaure au démarrage du serveur tmux
# After a restore, start Claude again in the panes where it ran, on its last conversation
set -g @resurrect-hook-post-restore-all '~/.local/bin/claude-tmux-wait restore'

# TPM doit rester la DERNIÈRE ligne du fichier
run '~/.tmux/plugins/tpm/tpm'
