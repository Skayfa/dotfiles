# Prompt on two lines, so each command stands out from the output above it:
#   line 1: folder in a blue pill, * when the git tree is dirty, branch only outside tmux (inside, the
#           tmux bar shows it), duration of slow commands, exit code when the last command failed
#   line 2: ❯ green, red after a failure. No time: the tmux bar and the macOS menu bar have it.
# Colours: Everforest, as tmux, Alacritty and the Claude Code status line.
command_timeout = 1000
add_newline = true

format = "[](fg:#7fbbb3)$directory[](fg:#7fbbb3)${custom.dirty}${custom.branch}$cmd_duration$status$line_break$character"

[directory]
format = "[ $path ]($style)"
style = "bold fg:#2d353b bg:#7fbbb3"
truncation_length = 4
truncate_to_repo = false

[custom.dirty]
when = 'test -n "$(git status --porcelain 2>/dev/null | head -1)"'
command = "echo '*'"
shell = ["sh"]
format = "[ $output](fg:#e69875)"

[custom.branch]
when = 'test -z "$TMUX" && git rev-parse --git-dir >/dev/null 2>&1'
command = "git branch --show-current"
shell = ["sh"]
format = "[  $output](fg:#83c092)"

[cmd_duration]
min_time = 2000
format = "[  $duration]($style)"
style = "fg:#859289"

[character]
success_symbol = "[❯](bold fg:#a7c080)"
error_symbol = "[❯](bold fg:#e67e80)"

[status]
disabled = false
format = "[ ✗ $status]($style)"
style = "bold fg:#e67e80"
